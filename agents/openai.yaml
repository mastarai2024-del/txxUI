interface:
  display_name: "txxUI"
  short_description: "继承设计师定稿的布局、字体与组件，绘制并核对 MasterGo 可编辑 UI 稿"
  default_prompt: "使用 $txxui，自动检查并补齐 Taste，先读取项目规范与用户认可的设计师定稿，提取同角色样式并优先复用真实组件；在项目的「AI绘制」下按任务与 PRD 归属新建 MasterGo 画布，同一任务续做复用，另一份 PRD 的其他需求另建，用户指定目标时优先遵从；根据需求或原型设计可编辑 UI 稿，并遵循当前工具的验收流程。"
policy:
  allow_implicit_invocation: true
